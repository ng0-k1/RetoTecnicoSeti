[project]
name = "asesor-financiero"
version = "0.1.0"
description = "Sistema multiagente para análisis de contratos y asesoría financiera de activos"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0",
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "pdfplumber>=0.11",
    "duckduckgo-search>=6.0",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
    "ddgs>=9.14.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
]
